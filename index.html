<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshi-Cal - 推し活スケジュール管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/isToday.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/locale/ja.js"></script>
    <script>
        dayjs.extend(window.dayjs_plugin_isToday);
        dayjs.locale('ja');
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fdf2f8; }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-24">

    <!-- 可愛いグラデーションヘッダー -->
    <header class="bg-white/80 backdrop-blur-md border-b border-pink-100 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-2.5">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-400 flex items-center justify-center text-white shadow-md shadow-pink-500/30">
                <i class="fa-solid fa-calendar-heart text-base"></i>
            </div>
            <h1 class="text-xl font-black bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent tracking-wide">Oshi-Cal</h1>
        </div>
        <button onclick="toggleMenu()" class="w-10 h-10 rounded-full bg-pink-50 flex items-center justify-center text-pink-600 hover:bg-pink-100 transition shadow-sm">
            <i class="fa-solid fa-bars text-base"></i>
        </button>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <div class="flex justify-between items-center px-1">
            <h2 class="text-base font-bold text-slate-700 flex items-center">
                <i class="fa-solid fa-sparkles text-pink-500 mr-2"></i>スケジュールまとめ
            </h2>
            <div class="flex bg-pink-100/60 p-1 rounded-full text-xs font-bold">
                <button id="tab-list" onclick="switchView('list')" class="px-4 py-1.5 rounded-full transition bg-white text-pink-600 shadow-sm">リスト</button>
                <button id="tab-month" onclick="switchView('month')" class="px-4 py-1.5 rounded-full transition text-slate-500 hover:text-slate-700">月表示</button>
            </div>
        </div>

        <!-- フィルターバー -->
        <div class="flex items-center space-x-2 bg-white p-2.5 rounded-2xl shadow-sm border border-pink-100/60">
            <div class="relative flex-1">
                <i class="fa-solid fa-filter absolute left-3.5 top-3 text-pink-400 text-xs"></i>
                <select id="group-filter" onchange="render()" class="w-full pl-9 pr-8 py-2 bg-pink-50/50 border border-pink-100 rounded-xl text-xs font-semibold text-slate-700 appearance-none focus:outline-none focus:ring-2 focus:ring-pink-400">
                    <option value="">すべてのグループ</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-3 top-3.5 text-[10px] text-pink-400 pointer-events-none"></i>
            </div>
            <button onclick="clearFilter()" class="w-9 h-9 flex items-center justify-center text-slate-400 hover:text-pink-600 bg-pink-50/50 border border-pink-100 rounded-xl transition">
                <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>
        </div>

        <!-- リストビュー -->
        <div id="view-list" class="space-y-3"></div>

        <!-- 月表示ビュー -->
        <div id="view-month" class="hidden space-y-4">
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-pink-100/60">
                <div class="flex justify-between items-center mb-4 px-2">
                    <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-full bg-pink-50 flex items-center justify-center text-pink-600 hover:bg-pink-100 transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                    <h3 id="calendar-title" class="font-bold text-slate-800 text-sm">2026年 9月</h3>
                    <button onclick="changeMonth(1)" class="w-8 h-8 rounded-full bg-pink-50 flex items-center justify-center text-pink-600 hover:bg-pink-100 transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-400 mb-2">
                    <span class="text-pink-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-purple-500">土</span>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5"></div>
            </div>
            <div id="selected-day-events" class="space-y-2.5"></div>
        </div>
    </main>

    <!-- フローティング追加ボタン -->
    <div class="fixed bottom-6 right-6 z-20">
        <button onclick="openAddModal()" class="w-14 h-14 rounded-full bg-gradient-to-tr from-pink-500 to-purple-500 text-white shadow-lg shadow-pink-500/40 flex items-center justify-center text-xl hover:scale-105 transition">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- サイドメニュー（グループ管理） -->
    <div id="side-menu" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden transition-opacity opacity-0" onclick="toggleMenu()">
        <div class="absolute right-0 top-0 bottom-0 w-80 bg-white shadow-2xl p-6 flex flex-col transform translate-x-full transition-transform duration-300" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 border-b border-pink-50 pb-4">
                <h3 class="text-base font-bold text-slate-800"><i class="fa-solid fa-users-rectangle mr-2 text-pink-500"></i>推しグループ管理</h3>
                <button onclick="toggleMenu()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="group-management-list"></div>
            <button onclick="openGroupAddModal()" class="mt-4 w-full py-3 bg-gradient-to-r from-pink-50 to-purple-50 text-pink-600 font-bold rounded-2xl hover:from-pink-100 hover:to-purple-100 transition text-xs border border-pink-100 shadow-sm">
                <i class="fa-solid fa-plus mr-1.5"></i> 新しいグループを追加
            </button>
        </div>
    </div>

    <!-- イベント追加モーダル -->
    <div id="event-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl border border-pink-50">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base text-slate-800 flex items-center"><i class="fa-solid fa-calendar-plus text-pink-500 mr-2"></i>予定を追加</h3>
                <button onclick="closeModal('event-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="event-form" onsubmit="saveEvent(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">グループ</label>
                    <select id="modal-group" required class="w-full p-3 bg-pink-50/40 border border-pink-100 rounded-2xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-pink-400"></select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">タイトル</label>
                    <input type="text" id="modal-title" required placeholder="例: 生誕ライブ" class="w-full p-3 bg-pink-50/40 border border-pink-100 rounded-2xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 mb-1">日付</label>
                        <input type="date" id="modal-date" required class="w-full p-3 bg-pink-50/40 border border-pink-100 rounded-2xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-pink-400">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 mb-1">時間</label>
                        <input type="time" id="modal-time" required class="w-full p-3 bg-pink-50/40 border border-pink-100 rounded-2xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-pink-400">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">場所</label>
                    <input type="text" id="modal-location" placeholder="例: 渋谷O-EAST" class="w-full p-3 bg-pink-50/40 border border-pink-100 rounded-2xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold rounded-2xl shadow-md shadow-pink-500/30 hover:opacity-95 transition text-xs mt-2">保存する</button>
            </form>
        </div>
    </div>

    <!-- グループ追加・編集モーダル -->
    <div id="group-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl border border-pink-50">
            <div class="flex justify-between items-center">
                <h3 id="group-modal-title" class="font-bold text-base text-slate-800">グループを追加</h3>
                <button onclick="closeModal('group-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="group-form" onsubmit="saveGroup(event)" class="space-y-3">
                <input type="hidden" id="group-edit-index" value="">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">グループ名</label>
                    <input type="text" id="group-modal-name" required placeholder="例: Onephony" class="w-full p-3 bg-pink-50/40 border border-pink-100 rounded-2xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">テーマカラー</label>
                    <input type="color" id="group-modal-color" value="#ec4899" class="w-full h-10 p-1 bg-pink-50/40 border border-pink-100 rounded-2xl cursor-pointer">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">Lit.Link などのURL</label>
                    <input type="url" id="group-modal-link" placeholder="https://lit.link/..." class="w-full p-3 bg-pink-50/40 border border-pink-100 rounded-2xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold rounded-2xl shadow-md shadow-pink-500/30 hover:opacity-95 transition text-xs mt-2">グループを保存</button>
            </form>
        </div>
    </div>

    <script>
        const AUTO_SYNC_CSV_URL = "https://docs.google.com/spreadsheets/d/1Pl3WUmqOdgE6IHMxNsOiemRu_A-EDk6xmIino4CKaEQ/export?format=csv";

        let groups = [
            { name: "Onephony", color: "#f43f5e", link: "" },
            { name: "マリークラウン", color: "#3b82f6", link: "" }
        ];
        let events = [];
        let currentView = 'list';
        let currentMonth = dayjs().startOf('month');
        let selectedDate = dayjs().format('YYYY-MM-DD');

        function loadUserData() {
            const savedGroups = localStorage.getItem('oshi_cal_groups');
            if (savedGroups) { try { groups = JSON.parse(savedGroups); } catch(e) {} }
            const savedEvents = localStorage.getItem('oshi_cal_manual_events');
            if (savedEvents) { try { events = JSON.parse(savedEvents); } catch(e) {} }
        }

        function saveUserData() {
            localStorage.setItem('oshi_cal_groups', JSON.stringify(groups));
            localStorage.setItem('oshi_cal_manual_events', JSON.stringify(events));
        }

        async function fetchSheetData() {
            if (!AUTO_SYNC_CSV_URL) return;
            try {
                const response = await fetch(AUTO_SYNC_CSV_URL);
                if (!response.ok) return;
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (e) {
                console.log("Auto sync failed:", e);
            }
        }

        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            let sheetEvents = [];
            let newGroupsFound = false;

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const cols = line.split(',').map(c => c.replace(/^["']|["']$/g, '').trim());
                if (cols.length >= 4) {
                    const rawDate = cols[0];
                    const parsedDate = dayjs(rawDate);
                    const date = parsedDate.isValid() ? parsedDate.format('YYYY-MM-DD') : rawDate;

                    const time = cols[1] || "00:00";
                    const groupName = cols[2];
                    const title = cols[3];
                    const location = cols[4] || "";

                    if (date && groupName && title) {
                        let group = groups.find(g => g.name === groupName);
                        if (!group) {
                            groups.push({ name: groupName, color: getRandomColor(), link: "" });
                            newGroupsFound = true;
                        }

                        sheetEvents.push({
                            id: 'sheet_' + i,
                            date: date,
                            time: time,
                            group: groupName,
                            title: title,
                            location: location,
                            isSheet: true
                        });
                    }
                }
            }

            if (newGroupsFound) saveUserData();
            
            const manualEvents = events.filter(e => !e.isSheet);
            events = [...manualEvents, ...sheetEvents];
            
            if (sheetEvents.length > 0) {
                const firstEventDate = dayjs(sheetEvents[0].date);
                if (firstEventDate.isValid()) {
                    currentMonth = firstEventDate.startOf('month');
                    selectedDate = firstEventDate.format('YYYY-MM-DD');
                }
            }
            render();
        }

        function getRandomColor() {
            const colors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#8b5cf6', '#3b82f6', '#0ea5e9', '#10b981', '#f59e0b'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function sortGroups() {
            groups.sort((a, b) => a.name.localeCompare(b.name, 'ja', { numeric: true }));
        }

        function render() {
            sortGroups();
            renderGroupDropdowns();
            renderGroupManagementList();

            if (currentView === 'list') {
                renderListView();
            } else {
                renderMonthView();
            }
        }

        function renderGroupDropdowns() {
            const filterSelect = document.getElementById('group-filter');
            const modalSelect = document.getElementById('modal-group');
            const currentFilter = filterSelect.value;
            const currentModalVal = modalSelect.value;

            let filterOpts = '<option value="">すべてのグループ</option>';
            let modalOpts = '';

            groups.forEach(g => {
                filterOpts += `<option value="${g.name}">${g.name}</option>`;
                modalOpts += `<option value="${g.name}">${g.name}</option>`;
            });

            filterSelect.innerHTML = filterOpts;
            filterSelect.value = currentFilter;
            modalSelect.innerHTML = modalOpts;
            if (currentModalVal) modalSelect.value = currentModalVal;
        }

        function renderGroupManagementList() {
            const container = document.getElementById('group-management-list');
            let html = '';
            groups.forEach((g, index) => {
                html += `
                    <div class="flex items-center justify-between p-3.5 bg-pink-50/40 border border-pink-100/80 rounded-2xl shadow-sm">
                        <div class="flex items-center space-x-3">
                            <span class="w-4 h-4 rounded-full shadow-sm" style="background-color: ${g.color}"></span>
                            <div>
                                <h4 class="font-bold text-xs text-slate-800">${g.name}</h4>
                                ${g.link ? `<a href="${g.link}" target="_blank" class="text-[10px] font-semibold text-pink-500 hover:underline"><i class="fa-solid fa-link mr-1"></i>Lit.Linkを開く</a>` : '<span class="text-[10px] text-slate-400">リンク未設定</span>'}
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button onclick="openGroupEditModal(${index})" class="w-8 h-8 rounded-xl text-slate-400 hover:text-pink-600 hover:bg-pink-100 flex items-center justify-center transition"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteGroup(${index})" class="w-8 h-8 rounded-xl text-slate-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderListView() {
            const container = document.getElementById('view-list');
            const filterVal = document.getElementById('group-filter').value;

            let filtered = events.slice().sort((a, b) => new Date(a.date + ' ' + a.time) - new Date(b.date + ' ' + b.time));
            if (filterVal) {
                filtered = filtered.filter(e => e.group === filterVal);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-3xl border border-pink-100/60 p-8 shadow-sm">
                        <i class="fa-regular fa-calendar-xmark text-4xl text-pink-300 mb-3"></i>
                        <p class="text-xs text-slate-400 font-medium">予定がありません</p>
                    </div>
                `;
                return;
            }

            let html = '';
            let lastDate = '';

            filtered.forEach(e => {
                const groupObj = groups.find(g => g.name === e.group);
                const color = groupObj ? groupObj.color : '#ec4899';
                const link = groupObj ? groupObj.link : '';
                const dateFormatted = dayjs(e.date).isValid() ? dayjs(e.date).format('M月D日(dd)') : e.date;
                const isToday = dayjs(e.date).isToday();

                if (e.date !== lastDate) {
                    html += `
                        <div class="flex items-center space-x-2 pt-3 pb-1 px-1">
                            <h3 class="font-bold text-slate-700 text-xs">${dateFormatted}</h3>
                            ${isToday ? '<span class="px-2 py-0.5 bg-pink-500 text-white text-[10px] font-bold rounded-full shadow-sm shadow-pink-500/30">今日</span>' : ''}
                        </div>
                    `;
                    lastDate = e.date;
                }

                html += `
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-pink-100/60 relative overflow-hidden flex items-stretch space-x-3">
                        <div class="w-1.5 rounded-full" style="background-color: ${color}"></div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between mb-1.5">
                                <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full" style="background-color: ${color}15; color: ${color};">${e.group}</span>
                                <span class="text-xs font-semibold text-slate-400">${e.time}</span>
                            </div>
                            <h4 class="font-bold text-slate-800 text-xs mb-1.5">${e.title}</h4>
                            ${e.location ? `<p class="text-[11px] text-slate-500 flex items-center mb-2"><i class="fa-solid fa-location-dot mr-1.5 text-pink-400"></i>${e.location}</p>` : ''}
                            
                            <div class="flex items-center justify-between pt-2 border-t border-pink-50">
                                ${link ? `<a href="${link}" target="_blank" class="text-[11px] font-bold text-pink-500 hover:underline"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Lit.Linkを開く</a>` : '<span></span>'}
                                ${!e.isSheet ? `<button onclick="deleteEvent('${e.id}')" class="text-slate-300 hover:text-red-500 text-[11px] transition"><i class="fa-solid fa-trash"></i> 削除</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderMonthView() {
            document.getElementById('calendar-title').innerText = currentMonth.format('YYYY年 M月');
            const grid = document.getElementById('calendar-grid');
            
            const startDay = currentMonth.startOf('month').day();
            const daysInMonth = currentMonth.daysInMonth();
            
            let html = '';
            for (let i = 0; i < startDay; i++) {
                html += `<div></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = currentMonth.date(day).format('YYYY-MM-DD');
                const hasEvent = events.some(e => e.date === dateStr);
                const isSelected = selectedDate === dateStr;
                const isToday = dayjs().format('YYYY-MM-DD') === dateStr;

                let classes = "h-11 rounded-2xl flex flex-col items-center justify-center text-xs font-bold relative transition cursor-pointer ";
                if (isSelected) {
                    classes += "bg-gradient-to-tr from-pink-500 to-purple-500 text-white shadow-md shadow-pink-500/30 ";
                } else if (isToday) {
                    classes += "border-2 border-pink-400 text-pink-500 bg-pink-50/50 ";
                } else {
                    classes += "hover:bg-pink-50 text-slate-700 ";
                }

                html += `
                    <div onclick="selectDate('${dateStr}')" class="${classes}">
                        <span>${day}</span>
                        ${hasEvent ? `<span class="w-1.5 h-1.5 rounded-full mt-1 ${isSelected ? 'bg-white' : 'bg-pink-500'}"></span>` : ''}
                    </div>
                `;
            }
            grid.innerHTML = html;
            renderSelectedDayEvents();
        }

        function selectDate(dateStr) {
            selectedDate = dateStr;
            renderMonthView();
        }

        function renderSelectedDayEvents() {
            const container = document.getElementById('selected-day-events');
            const dayEvents = events.filter(e => e.date === selectedDate).sort((a,b) => a.time.localeCompare(b.time));
            const filterVal = document.getElementById('group-filter').value;
            const filtered = filterVal ? dayEvents.filter(e => e.group === filterVal) : dayEvents;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-4 text-center border border-pink-100/60 text-xs text-slate-400 shadow-sm">
                        ${dayjs(selectedDate).format('M月D日')}の予定はありません
                    </div>
                `;
                return;
            }

            let html = `<h4 class="text-xs font-bold text-slate-500 px-1">${dayjs(selectedDate).format('M月D日')}の予定</h4>`;
            filtered.forEach(e => {
                const groupObj = groups.find(g => g.name === e.group);
                const color = groupObj ? groupObj.color : '#ec4899';
                const link = groupObj ? groupObj.link : '';

                html += `
                    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-pink-100/60 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <span class="w-2 h-8 rounded-full" style="background-color: ${color}"></span>
                            <div>
                                <div class="flex items-center space-x-2 mb-0.5">
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full" style="background-color: ${color}15; color: ${color};">${e.group}</span>
                                    <span class="text-xs font-semibold text-slate-400">${e.time}</span>
                                </div>
                                <h5 class="font-bold text-xs text-slate-800">${e.title}</h5>
                            </div>
                        </div>
                        ${link ? `<a href="${link}" target="_blank" class="text-xs text-pink-500 p-2 bg-pink-50 rounded-xl hover:bg-pink-100 transition"><i class="fa-solid fa-link"></i></a>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function switchView(view) {
            currentView = view;
            const listBtn = document.getElementById('tab-list');
            const monthBtn = document.getElementById('tab-month');
            const listDiv = document.getElementById('view-list');
            const monthDiv = document.getElementById('view-month');

            if (view === 'list') {
                listBtn.className = "px-4 py-1.5 rounded-full transition bg-white text-pink-600 shadow-sm";
                monthBtn.className = "px-4 py-1.5 rounded-full transition text-slate-500 hover:text-slate-700";
                listDiv.classList.remove('hidden');
                monthDiv.classList.add('hidden');
            } else {
                monthBtn.className = "px-4 py-1.5 rounded-full transition bg-white text-pink-600 shadow-sm";
                listBtn.className = "px-4 py-1.5 rounded-full transition text-slate-500 hover:text-slate-700";
                monthDiv.classList.remove('hidden');
                listDiv.classList.add('hidden');
            }
            render();
        }

        function changeMonth(direction) {
            currentMonth = currentMonth.add(direction, 'month');
            renderMonthView();
        }

        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const panel = menu.querySelector('div > div');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                setTimeout(() => {
                    menu.classList.remove('opacity-0');
                    panel.classList.remove('translate-x-full');
                }, 10);
            } else {
                menu.classList.add('opacity-0');
                panel.classList.add('translate-x-full');
                setTimeout(() => menu.classList.add('hidden'), 300);
            }
        }

        function openAddModal() {
            document.getElementById('modal-date').value = dayjs().format('YYYY-MM-DD');
            document.getElementById('modal-time').value = '19:00';
            document.getElementById('event-modal').classList.remove('hidden');
        }

        function openGroupAddModal() {
            document.getElementById('group-modal-title').innerText = "グループを追加";
            document.getElementById('group-edit-index').value = "";
            document.getElementById('group-modal-name').value = "";
            document.getElementById('group-modal-color').value = "#ec4899";
            document.getElementById('group-modal-link').value = "";
            document.getElementById('group-modal').classList.remove('hidden');
        }

        function openGroupEditModal(index) {
            const g = groups[index];
            document.getElementById('group-modal-title').innerText = "グループを編集";
            document.getElementById('group-edit-index').value = index;
            document.getElementById('group-modal-name').value = g.name;
            document.getElementById('group-modal-color').value = g.color;
            document.getElementById('group-modal-link').value = g.link || "";
            document.getElementById('group-modal').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function saveEvent(e) {
            e.preventDefault();
            const newEvent = {
                id: 'manual_' + Date.now(),
                group: document.getElementById('modal-group').value,
                title: document.getElementById('modal-title').value,
                date: document.getElementById('modal-date').value,
                time: document.getElementById('modal-time').value,
                location: document.getElementById('modal-location').value,
                isSheet: false
            };
            events.push(newEvent);
            saveUserData();
            closeModal('event-modal');
            render();
            document.getElementById('event-form').reset();
        }

        function saveGroup(e) {
            e.preventDefault();
            const editIndex = document.getElementById('group-edit-index').value;
            const name = document.getElementById('group-modal-name').value;
            const color = document.getElementById('group-modal-color').value;
            const link = document.getElementById('group-modal-link').value;

            if (editIndex !== "") {
                const oldName = groups[editIndex].name;
                groups[editIndex] = { name, color, link };
                events.forEach(ev => {
                    if (ev.group === oldName) ev.group = name;
                });
            } else {
                if (!groups.some(g => g.name === name)) {
                    groups.push({ name, color, link });
                }
            }

            saveUserData();
            closeModal('group-modal');
            render();
        }

        function deleteGroup(index) {
            if (confirm('このグループを削除してもよろしいですか？')) {
                groups.splice(index, 1);
                saveUserData();
                render();
            }
        }

        function deleteEvent(id) {
            if (confirm('この予定を削除しますか？')) {
                events = events.filter(e => e.id !== id);
                saveUserData();
                render();
            }
        }

        function clearFilter() {
            document.getElementById('group-filter').value = "";
            render();
        }

        window.onload = async () => {
            loadUserData();
            render();
            await fetchSheetData();
        };
    </script>
</body>
</html>
