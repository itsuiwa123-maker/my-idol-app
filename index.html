
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshi-Cal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/ja.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <script>
        dayjs.locale('ja');
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"M PLUS Rounded 1c"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#ff8ebf',
                        secondary: '#8ebcff',
                        bg: '#fdfbfb',
                        card: '#ffffff',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'soft-lg': '0 10px 30px -5px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fdfbfb; color: #475569; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-overlay, .sidebar-overlay {
            background-color: rgba(71, 85, 105, 0.4);
            backdrop-filter: blur(4px);
        }
        .details-content {
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .details-content.expanded {
            max-height: 600px;
            opacity: 1;
        }
        .calendar-day:hover {
            background-color: #f1f5f9;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

    <header class="bg-white/80 backdrop-blur-md shadow-sm z-20 px-5 py-3 flex justify-between items-center shrink-0 border-b border-gray-100">
        <div class="flex items-center gap-2">
            <div class="bg-gradient-to-br from-primary to-secondary p-1.5 rounded-xl text-white shadow-sm">
                <i class="ph-fill ph-calendar-star text-2xl"></i>
            </div>
            <h1 class="text-xl font-extrabold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent tracking-wide">Oshi-Cal</h1>
        </div>
        <div class="flex items-center gap-3">
            <div class="hidden sm:flex bg-gray-100 p-1 rounded-full items-center">
                <button onclick="setView('list')" id="btnViewList" class="px-4 py-1.5 rounded-full text-sm font-bold transition-all bg-white shadow-sm text-gray-700">リスト</button>
                <button onclick="setView('calendar')" id="btnViewCalendar" class="px-4 py-1.5 rounded-full text-sm font-bold transition-all text-gray-500 hover:text-gray-700">カレンダー</button>
            </div>
            <button id="mobileMenuBtn" class="md:hidden bg-gray-50 hover:bg-gray-100 p-2 rounded-full text-gray-600 text-2xl transition-colors">
                <i class="ph ph-list"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <div id="sidebarOverlay" class="fixed inset-0 sidebar-overlay z-30 hidden opacity-0 transition-opacity duration-300 md:hidden" onclick="toggleMobileSidebar()"></div>

        <aside id="sidebar" class="fixed md:relative w-72 h-full bg-white/95 backdrop-blur-xl border-r border-gray-100 flex flex-col transition-transform duration-300 z-40 transform -translate-x-full md:translate-x-0 shrink-0 shadow-2xl md:shadow-none rounded-r-3xl md:rounded-none">
            <div class="p-5 border-b border-gray-50 flex justify-between items-center md:hidden">
                <h2 class="font-bold text-gray-800 text-lg">グループ設定</h2>
                <button id="closeSidebarBtn" class="bg-gray-100 p-2 rounded-full text-gray-500 hover:text-gray-700 transition-colors">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-5 hide-scrollbar">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-gray-400 text-xs tracking-widest uppercase">フォロー中 (この端末のみ)</h2>
                    <button onclick="openModal()" class="text-primary hover:bg-pink-50 p-1.5 rounded-full transition-colors flex items-center justify-center" title="新しく追加">
                        <i class="ph-bold ph-plus text-lg"></i>
                    </button>
                </div>
                
                <div id="groupList" class="flex flex-col gap-2"></div>
            </div>

            <div class="p-5 bg-gradient-to-t from-gray-50 to-white/0 border-t border-gray-50">
                <button id="openAddModalBtn" class="w-full flex items-center justify-center gap-2 bg-white border border-gray-200 text-primary hover:bg-pink-50 py-3 rounded-full font-bold transition-all text-sm shadow-soft hover:shadow-soft-lg hover:-translate-y-0.5">
                    <i class="ph-bold ph-plus text-lg"></i>
                    グループを新規追加
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-bg p-4 md:p-8 relative scroll-smooth" id="scheduleMain">
            <div class="max-w-4xl mx-auto pb-24">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-6 gap-4">
                    <h2 class="text-2xl font-extrabold text-gray-800 tracking-tight" id="viewTitle">スケジュールまとめ</h2>
                    
                    <div class="flex items-center gap-2" id="listControls">
                        <div class="flex items-center gap-2 bg-white pl-4 pr-1 py-1 rounded-full shadow-soft border border-gray-100 focus-within:ring-2 focus-within:ring-primary/20 transition-all">
                            <i class="ph-duotone ph-magnifying-glass text-gray-400 text-lg"></i>
                            <input type="date" id="dateFilter" class="text-sm font-medium text-gray-600 outline-none bg-transparent cursor-pointer py-1" onchange="renderCurrentView()">
                            <button onclick="document.getElementById('dateFilter').value=''; renderCurrentView()" class="bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-full w-7 h-7 flex items-center justify-center transition-colors ml-1">
                                <i class="ph-bold ph-x text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div class="hidden items-center gap-4 bg-white px-4 py-2 rounded-full shadow-soft border border-gray-100" id="calendarControls">
                        <button onclick="changeMonth(-1)" class="p-1 text-gray-400 hover:text-primary transition-colors"><i class="ph-bold ph-caret-left text-lg"></i></button>
                        <span id="calendarMonthDisplay" class="font-bold text-gray-700 min-w-[100px] text-center"></span>
                        <button onclick="changeMonth(1)" class="p-1 text-gray-400 hover:text-primary transition-colors"><i class="ph-bold ph-caret-right text-lg"></i></button>
                    </div>
                </div>

                <div class="sm:hidden flex bg-gray-100 p-1 rounded-full items-center mb-6 max-w-[200px] mx-auto">
                    <button onclick="setView('list')" id="btnViewListMobile" class="flex-1 py-2 rounded-full text-sm font-bold transition-all bg-white shadow-sm text-gray-700">リスト</button>
                    <button onclick="setView('calendar')" id="btnViewCalendarMobile" class="flex-1 py-2 rounded-full text-sm font-bold transition-all text-gray-500">月表示</button>
                </div>

                <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-gray-400">
                    <div class="bg-gray-100 p-6 rounded-full mb-4">
                        <i class="ph-duotone ph-calendar-blank text-5xl text-gray-300"></i>
                    </div>
                    <p class="font-bold text-gray-500">表示する予定がありません</p>
                    <p class="text-sm mt-2">グループをオンにするか、新しく追加してください</p>
                </div>

                <div id="scheduleTimeline" class="flex flex-col gap-6"></div>

                <div id="calendarView" class="hidden bg-white rounded-3xl shadow-soft border border-gray-100 p-4 sm:p-6">
                    <div class="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-bold text-gray-400">
                        <div class="text-red-400">日</div>
                        <div>月</div><div>火</div><div>水</div><div>木</div><div>金</div>
                        <div class="text-blue-400">土</div>
                    </div>
                    <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2"></div>
                </div>
            </div>
        </main>

        <div class="fixed bottom-6 right-6 md:bottom-8 md:right-8 flex flex-col gap-3 z-30">
            <button onclick="resetToToday()" class="bg-white text-gray-600 hover:text-primary w-12 h-12 mx-auto rounded-full shadow-soft-lg border border-gray-100 transition-all hover:scale-110 flex items-center justify-center group relative">
                <i class="ph-bold ph-calendar-check text-xl"></i>
                <span class="absolute right-full mr-3 bg-gray-800 text-white text-xs font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none hidden md:block">今日/今月に戻る</span>
            </button>
            <button onclick="openModal()" class="bg-gradient-to-r from-primary to-secondary text-white w-14 h-14 rounded-full shadow-soft-lg transition-all hover:scale-110 hover:shadow-primary/30 flex items-center justify-center group relative">
                <i class="ph-bold ph-plus text-2xl"></i>
                <span class="absolute right-full mr-3 bg-gray-800 text-white text-xs font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none hidden md:block">グループ追加</span>
            </button>
        </div>
    </div>

    <div id="addModal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md transform scale-95 transition-transform duration-300 overflow-hidden" id="addModalContent">
            <div class="p-6 flex justify-between items-center bg-white border-b border-gray-50">
                <h3 class="font-bold text-xl text-gray-800">グループを追加</h3>
                <button id="closeModalBtn" class="bg-gray-100 hover:bg-gray-200 p-2 rounded-full text-gray-500 transition-colors">
                    <i class="ph-bold ph-x"></i>
                </button>
            </div>
            
            <form id="addGroupForm" class="p-6 space-y-6 bg-gray-50/50">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">グループ・アーティスト名 <span class="text-red-400">*</span></label>
                    <input type="text" id="groupName" required placeholder="例: Starry Girls" class="w-full border border-gray-200 rounded-2xl px-4 py-3 focus:ring-4 focus:ring-primary/20 focus:border-primary outline-none transition-all shadow-sm">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">テーマカラー <span class="text-red-400">*</span></label>
                    <div class="flex gap-2 sm:gap-3 flex-wrap" id="colorPicker">
                        <input type="radio" name="color" value="#ff7ba9" class="w-10 h-10 rounded-full appearance-none cursor-pointer border-4 border-transparent checked:border-gray-800 transition-all hover:scale-110 shadow-sm" style="background-color: #ff7ba9;" checked>
                        <input type="radio" name="color" value="#fb923c" class="w-10 h-10 rounded-full appearance-none cursor-pointer border-4 border-transparent checked:border-gray-800 transition-all hover:scale-110 shadow-sm" style="background-color: #fb923c;">
                        <input type="radio" name="color" value="#fbbf24" class="w-10 h-10 rounded-full appearance-none cursor-pointer border-4 border-transparent checked:border-gray-800 transition-all hover:scale-110 shadow-sm" style="background-color: #fbbf24;">
                        <input type="radio" name="color" value="#4ade80" class="w-10 h-10 rounded-full appearance-none cursor-pointer border-4 border-transparent checked:border-gray-800 transition-all hover:scale-110 shadow-sm" style="background-color: #4ade80;">
                        <input type="radio" name="color" value="#60a5fa" class="w-10 h-10 rounded-full appearance-none cursor-pointer border-4 border-transparent checked:border-gray-800 transition-all hover:scale-110 shadow-sm" style="background-color: #60a5fa;">
                        <input type="radio" name="color" value="#c084fc" class="w-10 h-10 rounded-full appearance-none cursor-pointer border-4 border-transparent checked:border-gray-800 transition-all hover:scale-110 shadow-sm" style="background-color: #c084fc;">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">情報ソース (URL) <span class="text-red-400">*</span></label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <select id="sourceType" class="bg-white border border-gray-200 rounded-2xl px-4 py-3 text-sm outline-none focus:ring-4 focus:ring-primary/20 shadow-sm">
                            <option value="litlink">LitLink</option>
                            <option value="google">Google Cal</option>
                            <option value="timetree">TimeTree</option>
                            <option value="x">公式X</option>
                        </select>
                        <input type="url" id="sourceUrl" required placeholder="https://..." class="flex-1 border border-gray-200 rounded-2xl px-4 py-3 focus:ring-4 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm shadow-sm">
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-primary to-secondary text-white font-bold rounded-full py-3.5 mt-2 hover:opacity-90 transition-all shadow-soft-lg hover:-translate-y-1 hover:shadow-primary/30">
                    追加して同期する
                </button>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800/95 backdrop-blur text-white px-6 py-3.5 rounded-full shadow-2xl transition-all duration-300 opacity-0 translate-y-10 z-50 pointer-events-none flex items-center gap-3">
        <i class="ph-fill ph-check-circle text-green-400 text-2xl"></i>
        <span id="toastMessage" class="text-sm font-bold"></span>
    </div>

    <script>
        let defaultGroups = [
            { id: 'g1', name: 'Starry Girls', color: '#ff7ba9', active: true, source: 'x' },
            { id: 'g2', name: 'Neon Boys', color: '#60a5fa', active: true, source: 'litlink' },
            { id: 'g3', name: 'Galaxy Project', color: '#c084fc', active: false, source: 'google' }
        ];

        let groups = [];
        let events = [];
        let currentView = 'list';
        let currentMonth = dayjs().startOf('month');

        // 【自動更新対応】ここにGoogleスプレッドシートの「ウェブに公開」したCSVのURLを貼り付けてください
        const AUTO_SYNC_CSV_URL = "https://docs.google.com/spreadsheets/d/1Pl3WUmqOdgE6IHMxNsOiemRu_A-EDk6xmIino4CKaEQ/export?format=csv"
;



        // データのロード（ブラウザごとのローカルストレージに保存されるため他の人には影響しません）
        function loadUserData() {
            const savedGroups = localStorage.getItem('oshi_cal_groups');
            if (savedGroups) {
                try {
                    groups = JSON.parse(savedGroups);
                } catch(e) {
                    groups = defaultGroups;
                }
            } else {
                groups = defaultGroups;
            }
        }

        function saveUserData() {
            localStorage.setItem('oshi_cal_groups', JSON.stringify(groups));
        }

        // CSVデータをパースしてイベントにする関数
        function parseCSVToEvents(csvText) {
            const lines = csvText.split('\n');
            const parsedEvents = [];
            const eventTypes = [
                { type: 'ライブ', icon: 'ph-microphone-stage' },
                { type: '配信', icon: 'ph-youtube-logo' },
                { type: '特典会', icon: 'ph-handshake' },
                { type: 'イベント', icon: 'ph-calendar-star' }
            ];

            // 1行目は見出しなので飛ばす (日付, 時間, グループ名, イベント名, 場所, チケットURL, 入場特典, レギュレーション)
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // 簡易CSVパース（カンマ区切り）
                const cols = line.split(',').map(c => c.replace(/^["']|["']$/g, '').trim());
                if (cols.length >= 5) {
                    const [dateStr, timeStr, groupName, eventName, location, ticketUrl, nyutoku, regulation] = cols;
                    
                    // グループ名が既存にあるか確認、なければ自動追加
                    let group = groups.find(g => g.name === groupName);
                    let groupId;
                    if (!group) {
                        groupId = 'g_auto_' + Math.random().toString(36).substring(2, 7);
                        const colors = ['#ff7ba9', '#fb923c', '#fbbf24', '#4ade80', '#60a5fa', '#c084fc'];
                        const randomColor = colors[Math.floor(Math.random() * colors.length)];
                        groups.push({ id: groupId, name: groupName, color: randomColor, active: true, source: 'google' });
                    } else {
                        groupId = group.id;
                    }

                    const fullDateTime = dayjs(`${dateStr} ${timeStr || '12:00'}`);
                    const matchedType = eventTypes.find(t => eventName.includes(t.type)) || eventTypes[0];

                    parsedEvents.push({
                        id: `evt_csv_${i}_${Date.now()}`,
                        groupId: groupId,
                        title: eventName,
                        date: fullDateTime.isValid() ? fullDateTime.toISOString() : dayjs().toISOString(),
                        location: location || '未定',
                        icon: matchedType.icon,
                        ticketUrl: ticketUrl || '#',
                        nyutoku: nyutoku || 'なし',
                        regulation: regulation || '未発表'
                    });
                }
            }
            saveUserData();
            return parsedEvents;
        }

        function generateMockEvents(groupId, count = 6) {
            const newEvents = [];
            const eventTypes = [
                { type: 'ライブ', icon: 'ph-microphone-stage', locations: ['渋谷O-EAST', 'Zepp Shinjuku', '豊洲PIT', '下北沢シェルター'] },
                { type: '配信', icon: 'ph-youtube-logo', locations: ['YouTube Live', 'TwitCasting'] },
                { type: '特典会', icon: 'ph-handshake', locations: ['池袋サンシャインシティ', '都内某所', 'タワーレコード渋谷'] },
                { type: 'TV出演', icon: 'ph-television', locations: ['地上波', 'ABEMA'] }
            ];
            const regulations = ["チェキ券 1,500円 / サイン付き 2,000円\n※列が途切れ次第終了", "全員チェキ 3,000円\n個別チェキ 1,500円", "握手券 1,000円", "レギュレーション未発表"];
            const nyutokus = ["ランダムチェキ1枚", "写メ券1枚", "ポイント2倍", "なし"];

            const today = dayjs();
            for (let i = 0; i < count; i++) {
                const daysOffset = Math.floor(Math.random() * 30) - 5; 
                const hour = Math.floor(Math.random() * (22 - 12) + 12);
                const eventDate = today.add(daysOffset, 'day').hour(hour).minute(0);
                const eventType = eventTypes[Math.floor(Math.random() * eventTypes.length)];
                const location = eventType.locations[Math.floor(Math.random() * eventType.locations.length)];

                newEvents.push({
                    id: `evt_${groupId}_${i}_${Date.now()}`,
                    groupId: groupId,
                    title: `${eventType.type} (${location})`,
                    date: eventDate.toISOString(),
                    location: location,
                    icon: eventType.icon,
                    url: '#',
                    ticketUrl: 'https://tiget.net/',
                    nyutoku: nyutokus[Math.floor(Math.random() * nyutokus.length)],
                    regulation: regulations[Math.floor(Math.random() * regulations.length)]
                });
            }
            return newEvents;
        }

        async function initializeApp() {
            loadUserData();

            if (AUTO_SYNC_CSV_URL) {
                try {
                    const response = await fetch(AUTO_SYNC_CSV_URL);
                    const csvText = await response.text();
                    events = parseCSVToEvents(csvText);
                } catch(e) {
                    console.error("自動更新データの取得に失敗しました。モックデータを使用します。", e);
                    loadDefaultEvents();
                }
            } else {
                loadDefaultEvents();
            }

            renderSidebar();
            renderCurrentView();

            document.getElementById('mobileMenuBtn').addEventListener('click', toggleMobileSidebar);
            document.getElementById('closeSidebarBtn').addEventListener('click', toggleMobileSidebar);
            document.getElementById('openAddModalBtn').addEventListener('click', openModal);
            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('addModal').addEventListener('click', (e) => {
                if (e.target.id === 'addModal') closeModal();
            });
            document.getElementById('addGroupForm').addEventListener('submit', handleAddGroup);
        }

        function loadDefaultEvents() {
            events = [];
            groups.forEach(g => {
                events = events.concat(generateMockEvents(g.id, 5));
            });
        }

        document.addEventListener('DOMContentLoaded', initializeApp);

        function renderSidebar() {
            const container = document.getElementById('groupList');
            container.innerHTML = '';

            groups.forEach(group => {
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-3 rounded-2xl transition-all cursor-pointer border ${group.active ? 'bg-white shadow-sm border-gray-100' : 'bg-transparent border-transparent hover:bg-gray-50'}`;
                
                const sourceIconMap = { 'x': 'ph-twitter-logo', 'litlink': 'ph-link', 'google': 'ph-google-logo', 'timetree': 'ph-calendar' };
                const sourceIcon = sourceIconMap[group.source] || 'ph-link';

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center shadow-sm text-white font-bold text-lg" style="background-color: ${group.color}">
                            ${group.name.charAt(0)}
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-gray-800 leading-tight">${group.name}</span>
                            <div class="flex items-center gap-1 text-[11px] text-gray-400 mt-1 font-medium">
                                <i class="ph-fill ${sourceIcon}"></i> 自動同期中
                            </div>
                        </div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer ml-2">
                        <input type="checkbox" class="sr-only peer" ${group.active ? 'checked' : ''} onchange="toggleGroupActive('${group.id}')">
                        <div class="w-10 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-400"></div>
                    </label>
                `;
                container.appendChild(item);
            });
        }

        function setView(view) {
            currentView = view;
            const btnList = document.getElementById('btnViewList');
            const btnCal = document.getElementById('btnViewCalendar');
            const btnListM = document.getElementById('btnViewListMobile');
            const btnCalM = document.getElementById('btnViewCalendarMobile');

            if(view === 'list') {
                btnList.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-all bg-white shadow-sm text-gray-700";
                btnCal.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-all text-gray-500 hover:text-gray-700";
                btnListM.className = "flex-1 py-2 rounded-full text-sm font-bold transition-all bg-white shadow-sm text-gray-700";
                btnCalM.className = "flex-1 py-2 rounded-full text-sm font-bold transition-all text-gray-500";
            } else {
                btnCal.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-all bg-white shadow-sm text-gray-700";
                btnList.className = "px-4 py-1.5 rounded-full text-sm font-bold transition-all text-gray-500 hover:text-gray-700";
                btnCalM.className = "flex-1 py-2 rounded-full text-sm font-bold transition-all bg-white shadow-sm text-gray-700";
                btnListM.className = "flex-1 py-2 rounded-full text-sm font-bold transition-all text-gray-500";
            }
            renderCurrentView();
        }

        function renderCurrentView() {
            if (currentView === 'list') {
                document.getElementById('scheduleTimeline').classList.remove('hidden');
                document.getElementById('calendarView').classList.add('hidden');
                document.getElementById('listControls').classList.remove('hidden');
                document.getElementById('calendarControls').classList.remove('flex');
                document.getElementById('calendarControls').classList.add('hidden');
                renderList();
            } else {
                document.getElementById('scheduleTimeline').classList.add('hidden');
                document.getElementById('calendarView').classList.remove('hidden');
                document.getElementById('listControls').classList.add('hidden');
                document.getElementById('calendarControls').classList.remove('hidden');
                document.getElementById('calendarControls').classList.add('flex');
                renderCalendar();
            }
        }

        function getActiveEvents() {
            const activeGroupIds = groups.filter(g => g.active).map(g => g.id);
            return events.filter(e => activeGroupIds.includes(e.groupId));
        }

        function changeMonth(delta) {
            currentMonth = currentMonth.add(delta, 'month');
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthDisplay = document.getElementById('calendarMonthDisplay');
            grid.innerHTML = '';
            monthDisplay.innerText = currentMonth.format('YYYY年 M月');
            
            const activeEvents = getActiveEvents();
            const startOfMonth = currentMonth.startOf('month');
            const endOfMonth = currentMonth.endOf('month');
            const startDate = startOfMonth.startOf('week');
            const endDate = endOfMonth.endOf('week');
            
            let currentDay = startDate;
            while (currentDay.isBefore(endDate) || currentDay.isSame(endDate, 'day')) {
                const isCurrentMonth = currentDay.month() === currentMonth.month();
                const isToday = currentDay.isSame(dayjs(), 'day');
                const dayStr = currentDay.format('YYYY-MM-DD');
                const dayEvents = activeEvents.filter(e => dayjs(e.date).format('YYYY-MM-DD') === dayStr);
                
                const cell = document.createElement('div');
                cell.className = `calendar-day min-h-[80px] sm:min-h-[100px] border border-gray-100 rounded-2xl p-1 sm:p-2 cursor-pointer transition-all flex flex-col ${isCurrentMonth ? 'bg-white' : 'bg-gray-50/50 opacity-60'} ${isToday ? 'ring-2 ring-primary/30 bg-pink-50/30' : ''}`;
                cell.onclick = () => {
                    document.getElementById('dateFilter').value = dayStr;
                    setView('list');
                };

                let dayContent = `
                    <div class="text-right mb-1">
                        <span class="inline-flex items-center justify-center w-6 h-6 sm:w-7 sm:h-7 rounded-full text-xs font-bold ${isToday ? 'bg-primary text-white' : (currentDay.day()===0 ? 'text-red-400' : currentDay.day()===6 ? 'text-blue-400' : 'text-gray-600')}">
                            ${currentDay.date()}
                        </span>
                    </div>
                    <div class="flex flex-col gap-1 overflow-hidden flex-1">
                `;

                dayEvents.slice(0, 3).forEach(evt => {
                    const group = groups.find(g => g.id === evt.groupId);
                    dayContent += `
                        <div class="text-[10px] sm:text-xs truncate px-1.5 py-0.5 rounded-full font-bold text-white shadow-sm" style="background-color: ${group ? group.color : '#ff7ba9'}">
                            ${dayjs(evt.date).format('HH:mm')} ${group ? group.name.substring(0,3) : '推し'}
                        </div>
                    `;
                });
                if(dayEvents.length > 3) {
                    dayContent += `<div class="text-[10px] text-gray-400 text-center font-bold">+${dayEvents.length - 3}</div>`;
                }
                dayContent += `</div>`;
                cell.innerHTML = dayContent;
                grid.appendChild(cell);
                currentDay = currentDay.add(1, 'day');
            }
        }

        function renderList() {
            const container = document.getElementById('scheduleTimeline');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            let activeEvents = getActiveEvents();
            const filterDate = document.getElementById('dateFilter').value;
            if (filterDate) {
                activeEvents = activeEvents.filter(e => dayjs(e.date).format('YYYY-MM-DD') === filterDate);
            }

            if (activeEvents.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                if (filterDate) emptyState.querySelector('p').innerText = '選択した日付の予定はありません';
                else emptyState.querySelector('p').innerText = '表示する予定がありません';
                return;
            }

            container.classList.remove('hidden');
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            activeEvents.sort((a, b) => dayjs(a.date).valueOf() - dayjs(b.date).valueOf());

            const groupedEvents = {};
            activeEvents.forEach(evt => {
                const dayStr = dayjs(evt.date).format('YYYY-MM-DD');
                if (!groupedEvents[dayStr]) groupedEvents[dayStr] = [];
                groupedEvents[dayStr].push(evt);
            });

            Object.keys(groupedEvents).sort().forEach(dayStr => {
                const dayEvents = groupedEvents[dayStr];
                const dDate = dayjs(dayStr);
                const isToday = dDate.isSame(dayjs(), 'day');
                const dayDisplay = dDate.format('M月D日 (ddd)');
                
                const dayBlock = document.createElement('div');
                dayBlock.className = 'fade-in relative';
                dayBlock.id = `dayblock-${dayStr}`;

                let headerHtml = `
                    <div class="sticky top-0 z-10 bg-[#fdfbfb]/90 backdrop-blur-md py-3 mb-4 flex items-center gap-3">
                        <h3 class="text-xl font-extrabold ${isToday ? 'text-primary' : 'text-gray-800'}">${dayDisplay}</h3>
                        ${isToday ? '<span class="bg-primary text-white text-xs px-3 py-1 rounded-full font-bold shadow-sm">今日</span>' : ''}
                    </div>
                `;
                
                let eventsHtml = `<div class="flex flex-col gap-4">`;
                dayEvents.forEach(evt => {
                    const group = groups.find(g => g.id === evt.groupId) || { name: 'その他', color: '#ff7ba9' };
                    const timeStr = dayjs(evt.date).format('HH:mm');
                    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(evt.location)}`;
                    
                    eventsHtml += `
                        <div class="group bg-white rounded-[24px] shadow-soft hover:shadow-soft-lg transition-all relative overflow-hidden border border-gray-50/50">
                            <div class="absolute left-0 top-0 bottom-0 w-2" style="background-color: ${group.color}"></div>
                            <div class="p-5 cursor-pointer flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-5 pl-6" onclick="toggleDetails('${evt.id}')">
                                <div class="text-xl font-extrabold text-gray-700 w-16 shrink-0 tracking-tight">${timeStr}</div>
                                <div class="flex-1">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-xs font-bold px-3 py-1 rounded-full border" style="background-color: ${group.color}10; color: ${group.color}; border-color: ${group.color}30">${group.name}</span>
                                        <div class="bg-gray-50 p-1.5 rounded-full group-hover:bg-gray-100 transition-colors">
                                            <i id="chevron-${evt.id}" class="ph-bold ph-caret-down text-gray-400 transition-transform duration-300"></i>
                                        </div>
                                    </div>
                                    <div class="font-bold text-gray-800 text-lg group-hover:text-primary transition-colors flex items-center gap-2">
                                        ${evt.title}
                                    </div>
                                </div>
                                <div class="flex flex-col items-start sm:items-end gap-2 mt-2 sm:mt-0">
                                    <a href="${mapUrl}" target="_blank" onclick="event.stopPropagation()" class="text-gray-500 bg-gray-50 hover:bg-blue-50 hover:text-blue-600 border border-gray-100 hover:border-blue-200 px-4 py-2 rounded-full flex items-center gap-2 text-xs font-bold w-full sm:w-auto transition-all shadow-sm">
                                        <i class="ph-fill ph-map-pin text-base"></i>
                                        ${evt.location}
                                    </a>
                                </div>
                            </div>

                            <div id="details-${evt.id}" class="details-content bg-slate-50/50 border-t border-gray-100">
                                <div class="p-5 sm:px-6 text-sm space-y-5">
                                    <div class="flex items-start gap-4">
                                        <div class="bg-blue-100 text-blue-600 p-2 rounded-xl mt-0.5 shadow-sm"><i class="ph-bold ph-ticket text-lg"></i></div>
                                        <div>
                                            <span class="font-bold text-gray-500 block text-xs mb-1">チケット情報</span>
                                            <a href="${evt.ticketUrl || '#'}" target="_blank" class="text-blue-600 hover:text-blue-700 hover:underline text-sm font-bold flex items-center gap-1">販売サイトを開く <i class="ph-bold ph-arrow-up-right text-xs"></i></a>
                                        </div>
                                    </div>
                                    <div class="flex items-start gap-4">
                                        <div class="bg-rose-100 text-rose-600 p-2 rounded-xl mt-0.5 shadow-sm"><i class="ph-bold ph-gift text-lg"></i></div>
                                        <div>
                                            <span class="font-bold text-gray-500 block text-xs mb-1">入場特典 (入特)</span>
                                            <span class="text-gray-800 font-bold">${evt.nyutoku || 'なし'}</span>
                                        </div>
                                    </div>
                                    <div class="flex items-start gap-4">
                                        <div class="bg-amber-100 text-amber-600 p-2 rounded-xl mt-0.5 shadow-sm"><i class="ph-bold ph-camera text-lg"></i></div>
                                        <div>
                                            <span class="font-bold text-gray-500 block text-xs mb-1">特典会レギュレーション</span>
                                            <span class="text-gray-800 font-medium whitespace-pre-line leading-relaxed block bg-white p-3 rounded-xl border border-gray-100 mt-1 shadow-sm">${evt.regulation || '未発表'}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                eventsHtml += `</div>`;
                dayBlock.innerHTML = headerHtml + eventsHtml;
                container.appendChild(dayBlock);
            });
        }

        window.toggleDetails = function(eventId) {
            const detailsElement = document.getElementById(`details-${eventId}`);
            const chevron = document.getElementById(`chevron-${eventId}`);
            if (detailsElement.classList.contains('expanded')) {
                detailsElement.classList.remove('expanded');
                chevron.classList.remove('rotate-180');
            } else {
                detailsElement.classList.add('expanded');
                chevron.classList.add('rotate-180');
            }
        };

        window.toggleGroupActive = function(groupId) {
            const group = groups.find(g => g.id === groupId);
            if (group) {
                group.active = !group.active;
                saveUserData(); 
                renderSidebar();
                renderCurrentView();
            }
        };

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function openModal() {
            const modal = document.getElementById('addModal');
            const content = document.getElementById('addModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
            if (!document.getElementById('sidebar').classList.contains('-translate-x-full')) {
                toggleMobileSidebar();
            }
        }

        function closeModal() {
            const modal = document.getElementById('addModal');
            const content = document.getElementById('addModalContent');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('addGroupForm').reset();
            }, 300);
        }

        function handleAddGroup(e) {
            e.preventDefault();
            const name = document.getElementById('groupName').value;
            const sourceType = document.getElementById('sourceType').value;
            const color = document.querySelector('input[name="color"]:checked').value;
            const newGroupId = 'g' + Date.now();
            
            const newGroup = {
                id: newGroupId,
                name: name,
                color: color,
                active: true,
                source: sourceType
            };

            groups.push(newGroup);
            const newEvents = generateMockEvents(newGroupId, 6);
            events = events.concat(newEvents);

            saveUserData(); 
            closeModal();
            renderSidebar();
            renderCurrentView();
            showToast(`${name}を追加しました！`);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('translate-y-10', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
            }, 3000);
        }

        window.resetToToday = function() {
            if (currentView === 'list') {
                document.getElementById('dateFilter').value = '';
                renderCurrentView();
                const todayStr = dayjs().format('YYYY-MM-DD');
                const todayBlock = document.getElementById(`dayblock-${todayStr}`);
                if (todayBlock) {
                    todayBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    showToast('今日の予定に移動しました');
                } else {
                    document.getElementById('scheduleMain').scrollTo({ top: 0, behavior: 'smooth' });
                    showToast('直近の今日の予定はありません');
                }
            } else {
                currentMonth = dayjs().startOf('month');
                renderCalendar();
                showToast('今月に戻りました');
            }
        };
    </script>
</body>
</html>
