<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTreeスケジュール - Oshi-Cal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fdf2f8; }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-10">

    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-pink-50 via-white to-purple-50 sticky top-0 z-30 px-5 py-4 flex items-center justify-between rounded-b-[2rem] shadow-md shadow-pink-200/40">
        <a href="index.html" class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-pink-400 to-purple-400 flex items-center justify-center text-white shadow-md shadow-pink-300/50 flex-shrink-0">
                <i class="fa-solid fa-arrow-left text-base"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent tracking-wide leading-tight">TimeTreeスケジュール</h1>
                <p class="text-[11px] text-slate-400 leading-tight">Oshi-Calに戻る</p>
            </div>
        </a>
        <button onclick="openGroupModal()" class="w-11 h-11 rounded-full bg-white flex items-center justify-center text-pink-500 hover:bg-pink-50 transition shadow-sm shadow-pink-200/60 flex-shrink-0">
            <i class="fa-solid fa-plus text-base"></i>
        </button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <p class="text-xs text-slate-500 px-1 leading-relaxed">
            TimeTreeで公開されているグループのスケジュールを、ここでまとめて見れるようにしてるよ。タブを切り替えて確認してね。
        </p>

        <!-- グループタブ -->
        <div id="group-tabs" class="flex flex-wrap gap-2"></div>

        <!-- 埋め込みカレンダー -->
        <div id="calendar-panels"></div>
    </main>

    <!-- グループ追加・編集モーダル -->
    <div id="group-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl border border-pink-50">
            <div class="flex justify-between items-center">
                <h3 id="group-modal-title" class="font-bold text-base text-slate-800">グループを追加</h3>
                <button onclick="closeGroupModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveGroup(event)" class="space-y-3">
                <input type="hidden" id="group-edit-index" value="">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">グループ名</label>
                    <input type="text" id="group-name" required placeholder="例: ZUTTOMOTTO【ずっともっと】" class="w-full p-3 bg-pink-50/40 border border-pink-100 rounded-2xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">テーマカラー</label>
                    <input type="color" id="group-color" value="#ec4899" class="w-full h-10 p-1 bg-pink-50/40 border border-pink-100 rounded-2xl cursor-pointer">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">TimeTreeカレンダーID</label>
                    <input type="text" id="group-calendar-id" required placeholder="例: zuttomoofficial" class="w-full p-3 bg-pink-50/40 border border-pink-100 rounded-2xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-pink-400">
                    <p class="text-[10px] text-slate-400 mt-1 px-1">「timetr.ee/p/◯◯」の◯◯部分、または「timetreeapp.com/public_calendars/◯◯」の◯◯部分をそのまま入力してね。</p>
                </div>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold rounded-2xl shadow-md shadow-pink-500/30 hover:opacity-95 transition text-xs mt-2">保存する</button>
            </form>
        </div>
    </div>

    <script>
        // グループ名・テーマカラー・TimeTreeの公開カレンダーID（初期値。以降はこの端末のlocalStorageで管理する）
        const DEFAULT_GROUPS = [
            { name: "ZUTTOMOTTO【ずっともっと】", color: "#f43f5e", calendarId: "zuttomoofficial" },
            { name: "なみだ色の消しごむ",           color: "#38bdf8", calendarId: "namikeshi" },
            { name: "LilyS/ash",                     color: "#a855f7", calendarId: "lilyslash" },
            { name: "マリークラウン",                color: "#3b82f6", calendarId: "mrcr" }
        ];
        const STORAGE_KEY = 'oshi_cal_timetree_groups';

        let groups = loadGroups();
        let activeIndex = 0;

        function loadGroups() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { return JSON.parse(saved); } catch (e) {}
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_GROUPS));
            return DEFAULT_GROUPS.slice();
        }

        function saveGroups() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(groups));
        }

        function embedUrl(calendarId) {
            return `https://timetreeapp.com/public_calendars/${calendarId}/embed/2weeks?frame=false`;
        }

        function renderTabs() {
            const tabs = document.getElementById('group-tabs');
            if (groups.length === 0) {
                tabs.innerHTML = '';
                return;
            }
            tabs.innerHTML = groups.map((g, i) => `
                <button onclick="selectGroup(${i})"
                    class="px-3.5 py-2 rounded-full text-xs font-bold border transition ${i === activeIndex ? 'text-white shadow-sm' : 'bg-white text-slate-500 border-pink-100'}"
                    style="${i === activeIndex ? `background-color:${g.color};border-color:${g.color};` : ''}">
                    ${g.name}
                </button>
            `).join('');
        }

        function renderPanel() {
            const panelContainer = document.getElementById('calendar-panels');

            if (groups.length === 0) {
                panelContainer.innerHTML = `
                    <div class="bg-white rounded-3xl p-8 text-center shadow-sm border border-pink-100/60">
                        <i class="fa-regular fa-calendar-xmark text-3xl text-pink-300 mb-3"></i>
                        <p class="text-xs text-slate-400 font-medium">まだグループがありません。右上の＋から追加してね。</p>
                    </div>
                `;
                return;
            }

            const g = groups[activeIndex];
            panelContainer.innerHTML = `
                <div class="bg-white rounded-3xl p-3 shadow-sm border border-pink-100/60 overflow-hidden">
                    <div class="flex items-center justify-between px-1 pb-2">
                        <div class="flex items-center space-x-2 min-w-0">
                            <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color:${g.color}"></span>
                            <h2 class="text-sm font-bold text-slate-700 truncate">${g.name}</h2>
                        </div>
                        <div class="flex items-center space-x-1 flex-shrink-0">
                            <button onclick="openGroupModal(${activeIndex})" class="w-7 h-7 rounded-lg text-slate-400 hover:text-pink-600 hover:bg-pink-50 flex items-center justify-center transition"><i class="fa-solid fa-pen text-[11px]"></i></button>
                            <button onclick="deleteGroup(${activeIndex})" class="w-7 h-7 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition"><i class="fa-solid fa-trash text-[11px]"></i></button>
                        </div>
                    </div>
                    <iframe
                        src="${embedUrl(g.calendarId)}"
                        class="w-full rounded-2xl border border-pink-50"
                        style="height: 620px;"
                        loading="lazy">
                    </iframe>
                    <a href="https://timetreeapp.com/public_calendars/${g.calendarId}" target="_blank" class="mt-2 flex items-center justify-center text-[11px] font-semibold text-slate-400 hover:text-pink-500 transition">
                        <i class="fa-solid fa-arrow-up-right-from-square mr-1.5"></i>TimeTreeで直接開く
                    </a>
                </div>
            `;
        }

        function selectGroup(index) {
            activeIndex = index;
            renderTabs();
            renderPanel();
        }

        function render() {
            renderTabs();
            renderPanel();
        }

        function openGroupModal(editIndex) {
            const isEdit = typeof editIndex === 'number';
            document.getElementById('group-modal-title').innerText = isEdit ? 'グループを編集' : 'グループを追加';
            document.getElementById('group-edit-index').value = isEdit ? editIndex : '';
            document.getElementById('group-name').value = isEdit ? groups[editIndex].name : '';
            document.getElementById('group-color').value = isEdit ? groups[editIndex].color : '#ec4899';
            document.getElementById('group-calendar-id').value = isEdit ? groups[editIndex].calendarId : '';
            document.getElementById('group-modal').classList.remove('hidden');
        }

        function closeGroupModal() {
            document.getElementById('group-modal').classList.add('hidden');
        }

        function saveGroup(e) {
            e.preventDefault();
            const editIndexRaw = document.getElementById('group-edit-index').value;
            const name = document.getElementById('group-name').value.trim();
            const color = document.getElementById('group-color').value;
            let calendarId = document.getElementById('group-calendar-id').value.trim();

            // フルURLを貼られた場合もIDだけ抜き取る
            const urlMatch = calendarId.match(/(?:public_calendars|\/p)\/([^/?]+)/);
            if (urlMatch) calendarId = urlMatch[1];

            if (editIndexRaw !== '') {
                groups[parseInt(editIndexRaw, 10)] = { name, color, calendarId };
            } else {
                groups.push({ name, color, calendarId });
                activeIndex = groups.length - 1;
            }

            saveGroups();
            closeGroupModal();
            render();
        }

        function deleteGroup(index) {
            if (!confirm(`「${groups[index].name}」を削除しますか？`)) return;
            groups.splice(index, 1);
            if (activeIndex >= groups.length) activeIndex = Math.max(0, groups.length - 1);
            saveGroups();
            render();
        }

        render();
    </script>
</body>
</html>
